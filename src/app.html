<!doctype html>
<html lang="mk">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		
		<!-- Favicon -->
		<link rel="icon" href="/favicon.ico" type="image/svg+xml" />
		
		<!-- Primary Meta Tags -->
		<meta name="keywords" content="поезија, песни, македонска поезија, дневна песна, литература" />
		<meta name="author" content="Поезија" />
		<meta name="theme-color" content="#7c3aed" />
		
		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://poezija.dimeski.net/" />
		<meta property="og:title" content="Поезија - Дневна доза поезија" />
		<meta property="og:description" content="Секој ден нова песна. Читај поезија и негувај го духот." />
		<meta property="og:image" content="https://poezija.dimeski.net/og-image.png" />
		
		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://poezija.dimeski.net/" />
		<meta property="twitter:title" content="Поезија - Дневна доза поезија" />
		<meta property="twitter:description" content="Секој ден нова песна. Читај поезија и негувај го духот." />
		<meta property="twitter:image" content="https://poezija.dimeski.net/og-image.png" />
		
		%sveltekit.head%
		<script>
			(function () {
				const theme = localStorage.getItem('theme');
				if (
					theme === 'dark' ||
					(!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
				) {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-slate-50 dark:bg-slate-950">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
